<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Site Builder</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #1a202c; }
        p { color: #4a5568; line-height: 1.6; }
        textarea { width: 100%; height: 120px; padding: 15px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; resize: vertical; margin-bottom: 15px; }
        button { background-color: #3182ce; color: white; padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #2b6cb0; }
        button:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .status { margin-top: 15px; font-style: italic; color: #718096; }
        .preview-container { margin-top: 30px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; display: none; }
        iframe { width: 100%; height: 600px; border: none; display: block; }
        .error { color: #e53e3e; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор сайтов на ИИ</h1>
        <p>Опишите сайт, который вы хотите создать. Например: "Сделай лендинг для кофейни с меню, галереей и формой связи" или "Создай портфолио для фотографа в минималистичном стиле".</p>
        
        <textarea id="promptInput" placeholder="Опишите ваш сайт здесь..."></textarea>
        <button id="generateBtn" onclick="generateSite()">Создать сайт</button>
        
        <div id="status" class="status"></div>
        <div id="error" class="error"></div>

        <div id="previewContainer" class="preview-container">
            <iframe id="previewFrame" title="Предпросмотр сайта"></iframe>
        </div>
    </div>

    <script>
        async function generateSite() {
            const promptInput = document.getElementById('promptInput');
            const generateBtn = document.getElementById('generateBtn');
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('error');
            const previewContainer = document.getElementById('previewContainer');
            const previewFrame = document.getElementById('previewFrame');

            const userPrompt = promptInput.value.trim();
            if (!userPrompt) {
                errorDiv.textContent = 'Пожалуйста, опишите сайт.';
                return;
            }

            // Сброс состояния
            generateBtn.disabled = true;
            statusDiv.textContent = 'Генерация... Это может занять до минуты.';
            errorDiv.textContent = '';
            previewContainer.style.display = 'none';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userPrompt })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Ошибка сервера');
                }

                const data = await response.json();
                
                // Загружаем сгенерированный HTML в iframe для предпросмотра
                const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(data.html);
                iframeDoc.close();

                previewContainer.style.display = 'block';
                statusDiv.textContent = 'Готово!';

            } catch (error) {
                errorDiv.textContent = 'Ошибка: ' + error.message;
                statusDiv.textContent = '';
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
